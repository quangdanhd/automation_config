name: "Galaxy Note 8"
version: 1.0.9

steps:
  # click account
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Tôi"
  # click
  - sleep:
      min: 6
      max: 8
  - swipeTapText:
      text: "Shopee Tiếp Thị Liên Kết"
      from:
        x: 500
        y: 1800
      to:
        x: 500
        y: 1000
  # click account
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Tài khoản"
  # video profile
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Hồ sơ Shopee Video"
  # push file
  - pushFile
  # click upload video button
  - tapText:
      text: "Đăng video"
  # click library button
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Thư viện"
  # select video ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 206
      y: 564
  # click next button
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Tiếp theo"
  # click next button
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Tiếp theo"
  # click describe ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 468
      y: 256
  # insert describe
  - sleep:
      min: 2
      max: 3
  - inputTitle
  # click agree ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 1007
      y: 124
  # click add product ===> screenshoot <=====?
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 537
      y: 685
  # click input link icon ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tapImageAfterGroupWithText:
      text: "Thêm sản phẩm"
  #  - tap:
  #      x: 1007
  #      y: 121
  # insert link
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Only URLs for Shopee products are supported. Please input up to 50 links in different lines."
  # insert link
  - sleep:
      min: 2
      max: 3
  - inputLinks
  # insert
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Nhập"
  # select all
  - sleep:
      min: 2
      max: 3
  - tapText:
      text: "Chọn tất cả"
  # click add products
  - sleep:
      min: 2
      max: 3
  - tapText:
      regex: '^Thêm\(\d+\)$'
  # click AI-generated video ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 971
      y: 1522
  # click publish button ===> screenshoot <=====
  - sleep:
      min: 2
      max: 3
  - tap:
      x: 500
      y: 2040
